services:
  postgres:
    platform: linux/arm64/v8
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osint
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    deploy: {resources: {limits: {memory: 1G}}}
  redis:
    image: redis:7-alpine
    deploy: {resources: {limits: {memory: 512M}}}
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me-now
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes: ["neo4j_data:/data"]
    deploy: {resources: {limits: {memory: 3G}}}
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    depends_on: [postgres, redis, neo4j]
    deploy: {resources: {limits: {memory: 1G}}}
volumes:
  postgres_data:
  neo4j_data:
